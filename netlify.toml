# The client, on Netlify. The API is a Render web service; this file is what puts the two
# on one origin.

[build]
  # client/ is its own npm project, so the build runs in there. `publish` is relative to it.
  base = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# /api on this origin, proxied to the API.
#
# Not a convenience: the session cookie is SameSite=Strict and the API carries no CORS, so a
# browser calling the API's own address directly would send no cookie and be signed out on
# every request. Proxying keeps everything the browser does on one origin, which is the same
# arrangement client/vite.config.ts gives development.
#
# status 200 is a rewrite rather than a redirect — the address in the bar stays this site's.
[[redirects]]
  from = "/api/*"
  to = "https://REPLACE-with-your-api.onrender.com/api/:splat"
  status = 200
  force = true

# Everything else is the application. It routes on the hash, so this only has to answer the
# one page; a reload on any address lands here rather than on a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
